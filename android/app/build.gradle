plugins { id 'com.android.application' }

android { namespace 'com.jarvis.assistant'; compileSdk 35
    defaultConfig { applicationId 'com.jarvis.assistant'; minSdk 26; targetSdk 35; versionCode 1; versionName '3.0.0' }
}

tasks.register('copyWebAssets', Copy) {
    from '../../dist'
    into 'src/main/assets/dist'
}
preBuild.dependsOn copyWebAssets
