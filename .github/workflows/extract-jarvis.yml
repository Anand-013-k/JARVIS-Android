name: Extract JARVIS Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract JARVIS ZIP
        run: |
          mkdir -p jarvis-extracted
          unzip -o "jarvis-ai-voice-assistant-android-upgraded.zip" -d jarvis-extracted

          shopt -s dotglob
          cp -a jarvis-extracted/* .
          rm -rf jarvis-extracted

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Extract upgraded JARVIS project" || echo "No changes to commit"
          git push
